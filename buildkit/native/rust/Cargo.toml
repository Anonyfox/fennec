[package]
name = "fennec_css"
version = "0.1.0"
edition = "2021"

[lib]
name = "fennec_css"
crate-type = ["staticlib"]

# Size-optimized release: link-time optimization, a single codegen unit, no
# unwinding tables (panic=abort), and stripped symbols. Keeps opt-level 3 so CSS
# throughput is unaffected; shrinks the static archive ~64% vs the default.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
# "bundler" enables Lightning CSS's @import resolver (Bundler + FileProvider) — the modern-CSS twin of
# grass's @use resolution, so an app's main.css can be an ordering manifest of @layer + @import.
lightningcss = { version = "1.0.0-alpha.71", features = ["bundler"] }
grass = { version = "0.13", default-features = false }
# Cross-platform filesystem events (FSEvents / inotify / kqueue / Windows) — the
# same crate cargo-watch/watchexec use. Powers the CLI dev supervisor's EVENTED
# watch of the built server exe (no polling). Vendored into the static archive.
notify = "6"
# Local image processing (the `fennec image` subcommand): decode any common format,
# resize/crop, re-encode. Pure-Rust core (`image`) + libwebp (`webp`) for lossy WebP.
# AVIF is intentionally left out for now (its rav1e encoder is the heaviest crate).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "ico", "bmp", "webp"] }
webp = { version = "0.3", default-features = false }
